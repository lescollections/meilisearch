# ----------------------------------------------------------------------
# Réglages du greffon Meilisearch — connecteur de recherche et greffon applicatif.
#
# Ce fichier est lu par les deux moitiés. Le connecteur, installé dans l'arborescence du socle,
# n'a pas de configuration à lui : il vient la chercher ici. C'est voulu — les deux ne
# s'installent pas l'un sans l'autre.
#
# Chaque réglage peut être surchargé, du plus fort au plus faible :
#
#   1. une constante définie dans setup.php   (__CA_MEILISEARCH_URL__, __CA_MEILISEARCH_API_KEY__,
#                                              __CA_MEILISEARCH_INDEX_PREFIX__)
#   2. une variable d'environnement           (CA_MEILISEARCH_URL, CA_MEILISEARCH_API_KEY,
#                                              CA_MEILISEARCH_INDEX_PREFIX)
#   3. ce fichier
#
# En conteneur, l'adresse du service et sa clé viennent de l'orchestrateur : les laisser vides
# ici et les passer par l'environnement.
# ----------------------------------------------------------------------

# Activer le greffon. À 0, il disparaît de « Vérification de la configuration » et ses hooks ne
# tournent plus — mais le connecteur de recherche, lui, refuse alors de s'initialiser.
enabled = 1

# ----------------------------------------------------------------------
# Le service
# ----------------------------------------------------------------------

# Adresse du service Meilisearch. Dans le harnais de développement, c'est le nom du service
# docker compose.
meilisearch_url = http://meilisearch:7700

# Clé d'API. Vide si le service tourne sans clé maîtresse (cas du harnais local).
meilisearch_api_key =

# Préfixe des noms d'index. Un index par table : <préfixe>_ca_objects, <préfixe>_ca_entities…
# Distinguer les préfixes permet de faire cohabiter plusieurs instances sur un même service.
meilisearch_index_prefix = ca

# Délai d'attente d'une requête HTTP, en secondes.
meilisearch_timeout = 10

# Délai d'attente d'une tâche d'indexation, en secondes. Meilisearch écrit en différé ; une
# réindexation complète du corpus enchaîne les lots, chacun devant aboutir.
meilisearch_task_timeout = 300

# ----------------------------------------------------------------------
# Indexation
# ----------------------------------------------------------------------

# Nombre de documents accumulés avant écriture. Trop petit, on multiplie les allers-retours ;
# trop grand, on gonfle la mémoire et on retarde la détection d'une erreur.
meilisearch_indexing_buffer_size = 500

# Plafond de résultats rendus par une recherche. CollectiveAccess pagine lui-même à partir du
# jeu complet d'identifiants, d'où une valeur volontairement très haute.
meilisearch_search_limit = 2000000

# ----------------------------------------------------------------------
# Journal
# ----------------------------------------------------------------------

# Journaliser chaque enregistrement d'élément (hookSaveItem). Bavard : pour le diagnostic.
log_saves = 0
