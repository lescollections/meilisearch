; Réglages PHP du harnais de développement — voir les erreurs, importer des médias, laisser
; tourner les traitements longs. Rien ici n'a vocation à ressembler à la prod.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On

memory_limit = 1024M
max_execution_time = 600
max_input_time = 600
post_max_size = 512M
upload_max_filesize = 512M
max_input_vars = 10000

date.timezone = Europe/Paris

; Le code du greffon est bind-monté depuis l'hôte : le cache d'opcode ne doit pas servir de
; version périmée d'un fichier qu'on vient d'éditer dans VS Code.
opcache.enable = 0
opcache.enable_cli = 0
realpath_cache_size = 0
