# Providence servie sous /gestion, comme en prod (__CA_URL_ROOT__ = /gestion).
#
# CollectiveAccess route sur PATH_INFO (URLs de la forme /gestion/index.php/administrate/…),
# donc un simple Alias suffit : pas besoin de réécriture pour que l'app fonctionne. mod_rewrite
# reste actif parce que le .htaccess livré par CA s'en sert (blocage des dotfiles, TRACE/TRACK,
# et URLs propres si on les active un jour).
#
# Ce fichier *remplace* le vhost par défaut de Debian (000-default.conf, désactivé dans le
# Dockerfile) : les directives d'alias posées au niveau serveur ne sont pas reprises dans un
# vhost, donc tout doit être ici.

ServerName localhost

<VirtualHost *:80>
    # La racine du serveur n'est pas la racine de l'app : sans ça, l'Alias entrerait en
    # conflit avec le DocumentRoot.
    DocumentRoot /var/www/site

    Alias /gestion /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Confort : http://localhost:8080/ tombe sur l'app.
    RedirectMatch ^/$ /gestion/index.php

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
