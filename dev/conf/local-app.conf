# Surcharge locale d'app.conf, pour le harnais de développement.
#
# L'entrypoint recopie ce fichier en app/conf/local/app.conf à chaque démarrage.
# CollectiveAccess le charge par-dessus app/conf/app.conf, et c'est la couche qui gagne.
#
# NE PAS revenir à app/conf/local/app_<__CA_APP_NAME__>.conf. Cette couche est composée sur le
# papier par Configuration.php, mais Configuration::load() — la voie qu'emprunte tout
# CollectiveAccess — ne la charge pas : le chargement de n'importe quel autre .conf construit
# app.conf avec cette couche désactivée (Configuration.php:163) puis mémorise l'instance.
# Le symptôme est un réglage qui « ne prend pas », sans aucun message.

# ── Le connecteur ─────────────────────────────────────────────────────────────────────────
# La directive pour laquelle tout ce harnais existe. C'est le nom du *fichier*
# (app/lib/Plugins/SearchEngine/Meilisearch.php), pas celui de la classe.
search_engine_plugin = Meilisearch

# ── Confort de développement ──────────────────────────────────────────────────────────────
# La barre de menus est mise en cache dans la session pendant dix minutes.
do_menu_bar_caching = 0

# Autoriser CollectiveAccess à aller chercher un média par son URL : nécessaire au chargement
# des images du jeu cleveland (CA_SEED_CLEVELAND_MEDIA=1). Désactivé en série par CA, et à
# raison — ça fait émettre au serveur des requêtes sortantes vers une adresse fournie en
# entrée. Ici l'entrée vient d'un fichier qu'on contrôle, sur une instance locale.
allow_fetching_of_media_from_remote_urls = 1
